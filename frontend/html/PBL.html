<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found - Polibatam</title>
    <link rel="stylesheet" href="../css/PBL.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS Khusus untuk Cetak Hard Copy PDF */
        @media print {
            body * { visibility: hidden; }
            #areaCetakFormulir, #areaCetakFormulir * { visibility: visible; }
            #areaCetakFormulir {
                position: absolute;
                left: 0; top: 0;
                width: 100%;
                border: 2px solid #000;
                padding: 20px;
                background: white;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-50">

<nav class="navbar shadow-lg bg-[#030c3b]">
    <div class="container navbar-container flex justify-between items-center w-full px-6 py-4">
        <a href="PBL.html" class="logo text-white font-bold text-xl hover:text-[#cdbc0b] transition">LOST n FOUND</a>
        <ul class="nav-links flex gap-6 items-center text-white">
            <li><a href="PBL.html" class="hover:text-[#cdbc0b] transition">Beranda</a></li>
            <li><a href="#lapor" class="hover:text-[#cdbc0b] transition">Buat Laporan</a></li>
        </ul>
        <div class="nav-auth flex items-center gap-4 text-white">
            <span class="text-sm">Halo, <b id="sapaanMahasiswa">Mahasiswa</b></span>
            <button onclick="keluarSistem()" class="bg-red-500 px-4 py-2 rounded font-bold shadow hover:-translate-y-1 transform transition">Logout</button>
        </div>
    </div>
</nav>

    <section id="home" class="hero flex flex-col justify-center items-center py-20 bg-gray-200">
        <div class="container mx-auto text-center">
            <h1 class="drop-shadow-lg text-5xl font-extrabold text-[#030c3b]">W E L C O M E</h1>
            <h2 class="text-2xl mt-4 font-bold text-gray-700" id="welcomeBesar">Selamat Datang!</h2>
            <a href="#pencarian" class="bg-[#030c3b] text-white px-6 py-3 rounded-lg shadow-lg mt-6 inline-block font-bold">Jelajahi</a>
        </div>
    </section>

    <!-- FORMULIR LAPORAN (Dengan File Upload & Cetak) -->
    <section id="lapor" class="py-16">
        <div class="container mx-auto max-w-3xl">
            <div id="areaCetakFormulir" class="bg-white p-8 rounded-xl shadow-lg border-2 border-gray-100">
                
                <div class="text-center mb-8 border-b-2 pb-4">
                    <h2 class="text-2xl font-bold text-[#030c3b]">Formulir Laporan Kehilangan / Temuan</h2>
                    <p class="text-gray-500">Politeknik Negeri Batam</p>
                </div>

                <form class="flex flex-col gap-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="font-bold text-sm">Nama Pelapor:</label>
                            <input type="text" id="inputNamaPelapor" class="w-full p-2 border-b-2 border-gray-300 outline-none" placeholder="Isi nama Anda">
                        </div>
                        <div>
                            <label class="font-bold text-sm">NIM:</label>
                            <input type="text" id="inputNimPelapor" class="w-full p-2 border-b-2 border-gray-300 outline-none" placeholder="Isi NIM Anda">
                        </div>
                    </div>

                    <div>
                        <label class="font-bold text-sm">Jenis Laporan:</label>
                        <select class="w-full p-2 border-b-2 border-gray-300 outline-none">
                            <option>Saya Kehilangan Barang</option>
                            <option>Saya Menemukan Barang</option>
                        </select>
                    </div>

                    <div>
                        <label class="font-bold text-sm">Deskripsi Barang & Lokasi:</label>
                        <textarea class="w-full p-2 border-2 border-gray-300 rounded outline-none" rows="3" placeholder="Tuliskan ciri-ciri barang dan lokasi kejadian..."></textarea>
                    </div>

                    <!-- FITUR UNGGAH FILE BUKTI -->
                    <div class="no-print">
                        <label class="font-bold text-sm text-[#030c3b]">Unggah Bukti Foto (Opsional):</label>
                        <input type="file" accept="image/*" class="w-full mt-2 p-2 border-2 border-dashed border-gray-400 rounded cursor-pointer">
                        <p class="text-xs text-gray-500 mt-1">Format didukung: JPG, PNG, PDF (Maks 2MB)</p>
                    </div>

                    <!-- TOMBOL AKSI -->
                    <div class="flex gap-4 mt-6 no-print">
                        <button type="button" onclick="window.print()" class="w-1/3 bg-gray-500 hover:bg-gray-600 text-white p-3 rounded font-bold">Cetak Hard Copy (PDF)</button>
                        <button type="submit" class="w-2/3 bg-[#030c3b] hover:bg-[#020826] text-white p-3 rounded font-bold shadow-lg">Kirim Laporan Online</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Skrip Sesi Mahasiswa -->
    <script>
        // Cek sesi login
        const user = JSON.parse(sessionStorage.getItem('activeUser'));
        if (!user || user.role !== 'mahasiswa') {
            alert('Anda harus login sebagai Mahasiswa terlebih dahulu!');
            window.location.href = 'login.html';
        } else {
            // Tampilkan nama sesuai user yang login
            document.getElementById('sapaanMahasiswa').innerText = user.nama;
            document.getElementById('welcomeBesar').innerText = 'Selamat Datang, ' + user.nama + '!';
            
            // Otomatis mengisi nama dan NIM di formulir jika ingin dicetak
            document.getElementById('inputNamaPelapor').value = user.nama;
            if(user.nim) document.getElementById('inputNimPelapor').value = user.nim;
        }

        function keluarSistem() {
            sessionStorage.removeItem('activeUser');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
