<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Lost & Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #areaCetakTabel, #areaCetakTabel * { visibility: visible; }
            #areaCetakTabel { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <nav class="bg-[#030c3b] p-4 text-white shadow-md no-print">
        <div class="container mx-auto flex justify-between items-center">
            <span class="font-bold text-amber-500">Panel Kontrol Admin</span>
            <div class="flex items-center gap-4 text-sm">
                <span>Petugas: <b id="adminName">Admin Pusat</b></span>
                <button onclick="sessionStorage.removeItem('activeUser'); window.location.href='login.html';" class="bg-red-500 px-3 py-1 rounded font-bold shadow">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        
        <!-- KARTU STATISTIK -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 no-print">
            <div class="bg-white p-6 rounded-xl shadow border-l-4 border-blue-500 text-center">
                <h3 class="text-gray-500 font-bold text-sm">TOTAL LAPORAN</h3>
                <p id="statTotal" class="text-3xl font-extrabold text-[#030c3b] mt-2">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border-l-4 border-amber-500 text-center">
                <h3 class="text-gray-500 font-bold text-sm">MENUNGGU VERIFIKASI</h3>
                <p id="statPending" class="text-3xl font-extrabold text-amber-600 mt-2">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border-l-4 border-green-500 text-center">
                <h3 class="text-gray-500 font-bold text-sm">LAPORAN VALID</h3>
                <p id="statValid" class="text-3xl font-extrabold text-green-600 mt-2">0</p>
            </div>
        </div>

        <!-- FITUR PENCARIAN & FILTER ADMIN -->
        <div class="bg-white p-4 rounded-t-xl shadow border border-b-0 flex flex-col md:flex-row justify-between items-center gap-4 no-print">
            <div class="flex flex-col md:flex-row gap-4 w-full md:w-auto">
                <input type="text" id="adminSearch" placeholder="Cari Nama, Barang, atau NIM..." class="p-2 border rounded outline-none focus:ring-2 focus:ring-[#030c3b] text-sm w-full md:w-64">
                <select id="adminFilter" class="p-2 border rounded outline-none text-sm">
                    <option value="Semua">Tampilkan Semua Status</option>
                    <option value="Pending">Hanya Menunggu (Pending)</option>
                    <option value="Valid">Hanya Valid</option>
                    <option value="Tidak Valid">Hanya Ditolak</option>
                </select>
            </div>
            <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded text-sm font-bold shadow w-full md:w-auto">🖨️ Cetak Rekap (PDF)</button>
        </div>

        <!-- TABEL VERIFIKASI -->
        <div id="areaCetakTabel" class="bg-white rounded-b-xl shadow border overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-100 border-b">
                    <tr>
                        <th class="p-4">Data Pelapor</th>
                        <th class="p-4">Barang & Kategori</th>
                        <th class="p-4">Lokasi Kejadian</th>
                        <th class="p-4">Foto / File</th>
                        <th class="p-4">Status Admin</th>
                        <th class="p-4 text-center no-print">Tindakan</th>
                    </tr>
                </thead>
                <tbody id="tabelVerifikasiAdmin">
                    <!-- Data laporan akan di-render otomatis oleh JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/PBL.js"></script>
    <script>
        const user = JSON.parse(sessionStorage.getItem('activeUser'));
        if (!user || user.role !== 'admin') { window.location.href = 'login.html'; } 
        else { document.getElementById('adminName').innerText = user.nama; }
    </script>
</body>
</html>
