<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database - FindIt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: url('images/bgpoltek.jpeg') no-repeat center center fixed; background-size: cover; color: white; }
        .estareal-overlay { position: fixed; inset: 0; background: linear-gradient(180deg, rgba(20,20,20,0.85) 0%, rgba(10,10,10,0.95) 100%); z-index: -2; }
        .perfect-blur { background: rgba(30, 30, 30, 0.4); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 40px 80px rgba(0,0,0,0.6); border-radius: 4px;}
        .glass-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.3); color: white; padding: 10px 0; outline: none; transition: 0.3s; font-size: 0.95rem; }
        .glass-input:focus { border-bottom: 1px solid white; }
        .glass-input option { background: #1a1a1a; color: white; }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <div class="estareal-overlay"></div>

    <nav class="glass-panel sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="PBL.html" class="font-bold tracking-widest text-lg"><i class="fa-solid fa-arrow-left mr-2"></i> KEMBALI</a>
            <span class="text-sm font-light tracking-widest">DATABASE LAPORAN</span>
        </div>
    </nav>

    <section class="container mx-auto px-6 py-12 flex-grow">
        <div class="flex flex-col md:flex-row gap-4 mb-10 items-center justify-between glass-panel p-6 rounded-2xl">
            <div class="w-full md:w-1/2 relative">
                <i class="fa-solid fa-search absolute right-0 top-3 text-gray-400"></i>
                <input type="text" id="inputSearch" placeholder="Cari nama barang atau lokasi..." class="glass-input">
            </div>
            <div class="w-full md:w-1/3">
                <select id="filterTipe" class="glass-input">
                    <option value="Semua">Semua Kategori</option>
                    <option value="Hilang">Hanya Barang Hilang</option>
                    <option value="Ditemukan">Hanya Barang Ditemukan</option>
                </select>
            </div>
        </div>

        <div id="reportContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Render oleh JS -->
        </div>
    </section>

    <script src="../js/PBL.js"></script>
</body>
</html>
