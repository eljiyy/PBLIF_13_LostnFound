<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - FindIt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background: url('bgpoltek2.jpeg') no-repeat center center fixed; background-size: cover; color: #fff; }
        .glass-overlay { background: rgba(10, 12, 20, 0.88); backdrop-filter: blur(10px); min-height: 100vh; display: flex; align-items: center; justify-content: center;}
        .cyber-input { background: transparent; border-bottom: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 0; outline: none; transition: 0.3s; }
        .cyber-input:focus { border-color: #2563eb; }
    </style>
</head>
<body>
<div class="glass-overlay">
    <div class="w-full max-w-lg p-10 bg-black/40 border border-white/10 rounded-xl backdrop-blur-md">
        <h2 class="text-2xl tracking-[0.2em] uppercase mb-2 font-light">Transmission <span class="font-bold text-blue-500">Link</span></h2>
        <p class="text-[10px] text-gray-400 tracking-widest uppercase mb-8 border-l-2 border-blue-600 pl-2">Hubungkan sinyal keluhan Anda ke Admin.</p>
        
        <form onsubmit="event.preventDefault(); alert('Transmission Sent.'); window.location.href='PBL.html'" class="flex flex-col gap-6 text-sm">
            <input type="text" placeholder="Identity (Name/NIM)" required class="w-full cyber-input">
            <textarea rows="3" placeholder="Message content..." required class="w-full cyber-input resize-none"></textarea>
            <button type="submit" class="border border-blue-600 text-blue-500 hover:bg-blue-600 hover:text-white py-3 tracking-[0.2em] text-[10px] uppercase mt-4 transition">
                Send Transmission
            </button>
        </form>
    </div>
</div>
</body>
</html>
