<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak & Keluhan - Lost & Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <nav class="bg-[#030c3b] sticky top-0 z-50 shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="PBL.html" class="text-white font-bold text-xl">LOST n FOUND</a>
            <div class="flex items-center gap-6">
                <a href="PBL.html" class="text-white hover:text-amber-400 text-sm font-semibold">Berita Terkini</a>
                <a href="lapor.html" class="text-white hover:text-amber-400 text-sm font-semibold">Buat Laporan</a>
                <a href="tentang.html" class="text-white hover:text-amber-400 text-sm font-semibold">Tentang Kami</a>
                <a href="kontak.html" class="text-amber-400 text-sm font-semibold">Hubungi Kami</a>
            </div>
        </div>
    </nav>

    <section class="container mx-auto px-4 py-16 flex-grow flex justify-center">
        <div class="w-full max-w-lg">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-[#030c3b]">Kirim Pesan / Keluhan</h2>
                <p class="text-sm text-gray-500 mt-2">Punya kendala dengan pelaporan? Atau ingin memberikan masukan untuk sistem kami? Kirimkan pesan di bawah ini.</p>
            </div>

            <form class="bg-white p-8 rounded-2xl shadow border border-gray-100 flex flex-col gap-5" onsubmit="event.preventDefault(); alert('Pesan Anda berhasil dikirim ke Admin. Terima kasih!'); this.reset();">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Nama Lengkap</label>
                    <input type="text" required class="w-full p-3 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-[#030c3b]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Email / NIM</label>
                    <input type="text" required class="w-full p-3 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-[#030c3b]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Tuliskan Pesan / Keluhan Anda</label>
                    <textarea rows="5" required class="w-full p-3 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-[#030c3b]"></textarea>
                </div>
                <button type="submit" class="bg-[#030c3b] hover:bg-black text-white font-bold py-3 rounded-lg transition">Kirim Pesan</button>
            </form>
        </div>
    </section>

    <footer class="bg-[#030c3b] text-white text-center py-4 mt-auto">
        <p class="text-sm">&copy; 2026 Yusuf Fauzi & Fitra Luqmanul Safa. Politeknik Negeri Batam.</p>
    </footer>

</body>
</html>
