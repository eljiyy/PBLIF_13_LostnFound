<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Laporan - Lost & Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    
    <nav class="bg-[#030c3b] sticky top-0 z-50 shadow-md p-4 flex justify-between items-center text-white container mx-auto">
        <a href="PBL.html" class="font-bold text-xl">LOST n FOUND</a>
        <button onclick="window.location.href='PBL.html'" class="bg-red-500 px-3 py-1 rounded text-xs font-bold">Kembali</button>
    </nav>

    <section class="container mx-auto max-w-2xl px-4 py-12 flex-grow">
        <div class="bg-white p-8 rounded-2xl shadow-lg border-t-4 border-amber-400">
            <h2 class="text-2xl font-bold text-[#030c3b] text-center mb-6">Formulir Laporan Resmi</h2>

            <!-- TANPA ONSUBMIT (Diurus otomatis oleh PBL.js) -->
            <form id="formLaporMahasiswa" class="flex flex-col gap-4">
                <select name="tipe" required class="p-2.5 border rounded-lg text-sm"><option value="Kehilangan">Barang Hilang</option><option value="Ditemukan">Barang Temuan</option></select>
                <input type="text" name="nama_barang" placeholder="Nama Barang (Cth: Dompet Hitam)" required class="p-2.5 border rounded-lg text-sm">
                <div class="grid grid-cols-2 gap-4">
                    <select name="kategori" required class="p-2.5 border rounded-lg text-sm"><option value="Dokumen">Dokumen</option><option value="Elektronik">Elektronik</option><option value="Aksesoris">Aksesoris</option></select>
                    <input type="date" name="tanggal" required class="p-2.5 border rounded-lg text-sm">
                </div>
                <input type="text" name="lokasi" placeholder="Lokasi (Cth: Gedung A)" required class="p-2.5 border rounded-lg text-sm">
                <textarea name="ciri" rows="3" placeholder="Sebutkan ciri khusus..." required class="p-2.5 border rounded-lg text-sm"></textarea>
                <input type="file" required class="p-2 border border-dashed rounded text-xs cursor-pointer">
                <button type="submit" class="bg-[#030c3b] text-white py-3 rounded-lg font-bold">Kirim Laporan</button>
            </form>
        </div>
    </section>
    
    <script src="js/PBL.js"></script>
</body>
</html>
