<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Laporan - Lost & Found Polibatam</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <nav class="bg-[#030c3b] sticky top-0 z-50 shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center text-white">
            <a href="PBL.html" class="font-extrabold text-xl tracking-wide">LOST n FOUND</a>
            <button onclick="window.location.href='PBL.html'" class="bg-red-500 hover:bg-red-600 transition px-5 py-2 rounded-lg text-sm font-bold shadow-md">
                Kembali ke Beranda
            </button>
        </div>
    </nav>

    <section class="container mx-auto max-w-3xl px-4 py-12 flex-grow">
        <div class="bg-white p-8 md:p-10 rounded-2xl shadow-xl border-t-4 border-amber-400">
            
            <div class="text-center mb-8 border-b pb-6">
                <h2 class="text-3xl font-extrabold text-[#030c3b]">Formulir Laporan Resmi</h2>
                <p class="text-sm text-gray-500 mt-2">Laporan Anda akan ditinjau oleh petugas sebelum dipublikasikan ke publik.</p>
            </div>

            <!-- PERUBAHAN: onsubmit sekarang memanggil fungsi lokal simpanData() -->
            <form onsubmit="event.preventDefault(); simpanData();" class="flex flex-col gap-6">
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Jenis Laporan <span class="text-red-500">*</span></label>
                    <select id="lap_tipe" required class="w-full p-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-[#030c3b] focus:ring-2 focus:ring-[#030c3b]">
                        <option value="Kehilangan">Saya Kehilangan Barang</option>
                        <option value="Ditemukan">Saya Menemukan Barang</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Nama Barang <span class="text-red-500">*</span></label>
                    <input type="text" id="lap_nama" placeholder="Contoh: Dompet Kulit Hitam / Kunci Motor Honda" required class="w-full p-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-[#030c3b] focus:ring-2 focus:ring-[#030c3b]">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Kategori Barang <span class="text-red-500">*</span></label>
                        <select id="lap_kategori" required class="w-full p-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-[#030c3b] focus:ring-2 focus:ring-[#030c3b]">
                            <option value="Dokumen">Dokumen / Identitas (KTM, KTP)</option>
                            <option value="Elektronik">Elektronik (HP, Laptop, Flashdisk)</option>
                            <option value="Aksesoris">Aksesoris / Kunci Kendaraan</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Tanggal Kejadian <span class="text-red-500">*</span></label>
                        <input type="date" id="lap_tanggal" required class="w-full p-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-[#030c3b] focus:ring-2 focus:ring-[#030c3b]">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Lokasi Terakhir / Ditemukan <span class="text-red-500">*</span></label>
                    <input type="text" id="lap_lokasi" placeholder="Contoh: Area Parkir Gedung Utama" required class="w-full p-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-[#030c3b] focus:ring-2 focus:ring-[#030c3b]">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Ciri-ciri Khusus Barang <span class="text-red-500">*</span></label>
                    <textarea id="lap_ciri" rows="4" placeholder="Jelaskan detail spesifik..." required class="w-full p-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-[#030c3b] focus:ring-2 focus:ring-[#030c3b]"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Unggah Foto Bukti <span class="text-red-500">*</span></label>
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-5 bg-gray-50 text-center">
                        <input type="file" accept="image/*" required class="w-fit mx-auto block text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:bg-[#030c3b] file:text-white cursor-pointer">
                    </div>
                </div>

                <button type="submit" class="mt-4 w-full bg-[#030c3b] hover:bg-amber-400 hover:text-[#030c3b] text-white font-extrabold py-4 rounded-lg shadow-lg transition text-lg">
                    Kirim Laporan ke Petugas
                </button>
            </form>

        </div>
    </section>

    <footer class="bg-[#030c3b] text-gray-400 text-center py-6 mt-auto">
        <p class="text-sm">&copy; 2026 Yusuf Fauzi & Fitra Luqmanul Safa - Politeknik Negeri Batam.</p>
    </footer>
    
    <!-- SKRIP PENYIMPANAN LANGSUNG -->
    <script>
        // 1. Cek User
        const user = JSON.parse(sessionStorage.getItem('activeUser'));
        if (!user || user.role !== 'mahasiswa') { 
            alert('Silakan login terlebih dahulu.');
            window.location.href = 'login.html'; 
        }

        // 2. Eksekusi Simpan Data Pasti Jalan
        function simpanData() {
            try {
                // Ambil semua input berdasarkan ID
                const laporanBaru = {
                    id: Date.now(),
                    pelapor: user.nama,
                    nim: user.nim,
                    tipe: document.getElementById('lap_tipe').value,
                    nama_barang: document.getElementById('lap_nama').value,
                    kategori: document.getElementById('lap_kategori').value,
                    tanggal: document.getElementById('lap_tanggal').value,
                    lokasi: document.getElementById('lap_lokasi').value,
                    ciri: document.getElementById('lap_ciri').value,
                    buktiFile: 'https://images.unsplash.com/photo-1586281380349-632531db7ed4?auto=format&fit=crop&w=400&q=80',
                    status: 'Pending',
                    tanggalDibuat: new Date().toLocaleDateString('id-ID')
                };

                // Panggil database
                let db = JSON.parse(localStorage.getItem('lostFoundLaporan')) || [];
                db.push(laporanBaru);
                
                // Simpan
                localStorage.setItem('lostFoundLaporan', JSON.stringify(db));

                // Notif & Redirect
                alert('✅ BERHASIL! Laporan Anda berhasil dikirim dan masuk ke antrean Admin.');
                window.location.href = 'PBL.html';

            } catch (err) {
                alert('Gagal memproses data: ' + err.message);
                console.error(err);
            }
        }
    </script>
</body>
</html>
