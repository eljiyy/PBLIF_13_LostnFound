<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Laporan - Lost & Found Polibatam</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- NAVBAR DIPERBAIKI (Full Width Background) -->
    <nav class="bg-[#030c3b] sticky top-0 z-50 shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center text-white">
            <a href="PBL.html" class="font-extrabold text-xl tracking-wide">LOST n FOUND</a>
            <button onclick="window.location.href='PBL.html'" class="bg-red-500 hover:bg-red-600 transition px-5 py-2 rounded-lg text-sm font-bold shadow-md">
                ⬅ Kembali ke Beranda
            </button>
        </div>
    </nav>

    <!-- KONTEN FORMULIR -->
    <section class="container mx-auto max-w-3xl px-4 py-12 flex-grow">
        <div class="bg-white p-8 md:p-10 rounded-2xl shadow-xl border-t-4 border-amber-400">
            
            <div class="text-center mb-8 border-b pb-6">
                <h2 class="text-3xl font-extrabold text-[#030c3b]">Formulir Laporan Resmi</h2>
                <p class="text-sm text-gray-500 mt-2">Isi data dengan lengkap dan jelas. Laporan Anda akan ditinjau oleh petugas sebelum dipublikasikan ke publik.</p>
            </div>

            <!-- FORMULIR (ID 'formLaporMahasiswa' akan ditangkap otomatis oleh PBL.js) -->
            <form id="formLaporMahasiswa" class="flex flex-col gap-6">
                
                <!-- Jenis Laporan -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Jenis Laporan <span class="text-red-500">*</span></label>
                    <select name="tipe" required class="w-full p-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-[#030c3b] focus:ring-2 focus:ring-[#030c3b] transition">
                        <option value="Kehilangan">Saya Kehilangan Barang</option>
                        <option value="Ditemukan">Saya Menemukan Barang</option>
                    </select>
                </div>

                <!-- Nama Barang -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Nama Barang <span class="text-red-500">*</span></label>
                    <input type="text" name="nama_barang" placeholder="Contoh: Dompet Kulit Hitam / Kunci Motor Honda" required class="w-full p-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-[#030c3b] focus:ring-2 focus:ring-[#030c3b] transition">
                </div>

                <!-- Kategori & Tanggal Kejadian (Dibagi 2 kolom) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Kategori Barang <span class="text-red-500">*</span></label>
                        <select name="kategori" required class="w-full p-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-[#030c3b] focus:ring-2 focus:ring-[#030c3b] transition">
                            <option value="Dokumen">Dokumen / Identitas (KTM, KTP)</option>
                            <option value="Elektronik">Elektronik (HP, Laptop, Flashdisk)</option>
                            <option value="Aksesoris">Aksesoris / Kunci Kendaraan</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Tanggal Kejadian <span class="text-red-500">*</span></label>
                        <input type="date" name="tanggal" required class="w-full p-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-[#030c3b] focus:ring-2 focus:ring-[#030c3b] transition">
                    </div>
                </div>

                <!-- Lokasi Kejadian -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Lokasi Terakhir / Ditemukan <span class="text-red-500">*</span></label>
                    <input type="text" name="lokasi" placeholder="Contoh: Area Parkir Gedung Utama / Kantin Kampus" required class="w-full p-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-[#030c3b] focus:ring-2 focus:ring-[#030c3b] transition">
                </div>

                <!-- Ciri-ciri Khusus -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Ciri-ciri Khusus Barang <span class="text-red-500">*</span></label>
                    <textarea name="ciri" rows="4" placeholder="Jelaskan detail spesifik agar mudah diverifikasi (contoh: merk, warna, stiker, goresan, dll)..." required class="w-full p-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-[#030c3b] focus:ring-2 focus:ring-[#030c3b] transition"></textarea>
                </div>

                <!-- Upload File Bukti -->
              <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Unggah Foto Barang <span class="text-red-500">*</span></label>
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-5 bg-gray-50 hover:bg-gray-100 transition text-center flex flex-col items-center justify-center">
                        <!-- w-full diganti menjadi w-fit mx-auto block -->
                        <input type="file" accept="image/*" required class="w-fit mx-auto block text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-[#030c3b] file:text-white hover:file:bg-black cursor-pointer outline-none">
                        <p class="text-xs text-gray-400 mt-3">Format: JPG, PNG, JPEG. (Wajib ada foto barang / lokasi)</p>
                    </div>
                </div>

                <!-- Tombol Submit -->
                <button type="submit" class="mt-4 w-full bg-[#030c3b] hover:bg-amber-400 hover:text-[#030c3b] text-white font-extrabold py-4 rounded-lg shadow-lg transition transform hover:-translate-y-1 text-lg">
                    Kirim Laporan ke Petugas
                </button>

            </form>
        </div>
    </section>

    <!-- FOOTER DIKEMBALIKAN -->
    <footer class="bg-[#030c3b] text-gray-400 text-center py-6 mt-auto">
        <p class="text-sm">&copy; 2026 Yusuf Fauzi & Fitra Luqmanul Safa - Politeknik Negeri Batam.</p>
    </footer>
    
    <!-- Panggil Skrip Utama -->
    <script src="js/PBL.js"></script>
    <script>
        // Memastikan halaman ini hanya bisa diakses mahasiswa yang login
        const user = JSON.parse(sessionStorage.getItem('activeUser'));
        if (!user || user.role !== 'mahasiswa') { 
            alert('Silakan login terlebih dahulu.');
            window.location.href = 'login.html'; 
        }
    </script>
</body>
</html>
