<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Laporan - Lost & Found</title>
    <link rel="stylesheet" href="../css/PBL.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- NAVBAR -->
    <nav class="navbar shadow-lg">
        <div class="container flex justify-between items-center w-full">
            <a href="PBL.html" class="logo text-white font-bold text-xl hover:text-[#cdbc0b] transition">LOST n FOUND</a>
            <ul class="nav-links flex gap-6 items-center">
                <li><a href="PBL.html" class="hover:text-[#cdbc0b] transition">Beranda</a></li>
                <li><a href="daftar-laporan.html" class="hover:text-[#cdbc0b] transition">Daftar Laporan</a></li>
                <li><a href="lapor.html" class="text-[#cdbc0b]">Buat Laporan</a></li>
                <li><a href="rekap.html" class="hover:text-[#cdbc0b] transition">Rekap Data</a></li>
            </ul>
        </div>
    </nav>

    <!-- FORM PELAPORAN -->
    <section class="report-form-section pt-32 pb-12 flex-grow">
        <div class="container mx-auto max-w-3xl">
            <h2 class="text-3xl font-bold text-center text-[#030c3b] mb-2">Form Tambah Laporan</h2>
            <p class="text-center text-gray-500 mb-8">Laporkan barang yang anda temukan atau hilangkan disini.</p>
            
            <!-- ID "formLapor" sudah dikaitkan dengan PBL.js untuk LocalStorage -->
            <form id="formLapor" class="bg-white p-8 rounded-2xl shadow-xl flex flex-col gap-5">
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Tipe Laporan</label>
                    <select name="tipe" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#030c3b] outline-none">
                        <option value="" disabled selected>Pilih Tipe Laporan...</option>
                        <option value="Hilang">Kehilangan Barang</option>
                        <option value="Ditemukan">Menemukan Barang</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Nama Barang</label>
                    <input type="text" name="nama_barang" placeholder="Contoh: KTM Mahasiswa" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#030c3b] outline-none">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Kategori Barang</label>
                    <select name="kategori" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#030c3b] outline-none">
                        <option value="" disabled selected>Pilih Kategori...</option>
                        <option value="1">Elektronik (Laptop, HP)</option>
                        <option value="2">Dokumen (KTM, KTP, Berkas)</option>
                        <option value="3">Aksesoris (Dompet, Jam Tangan)</option>
                        <option value="4">Lainnya</option>
                    </select>
                </div>

                <div class="flex flex-col md:flex-row gap-5">
                    <div class="flex-1">
                        <label class="block text-sm font-bold text-gray-700 mb-1">Tanggal Kejadian</label>
                        <input type="date" name="tanggal" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#030c3b] outline-none">
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-bold text-gray-700 mb-1">Lokasi Terakhir / Ditemukan</label>
                        <input type="text" name="lokasi" placeholder="Contoh: Lab Komputer 1" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#030c3b] outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Deskripsi Barang</label>
                    <textarea name="ciri" rows="3" placeholder="Sebutkan warna, merek, ukuran, atau tanda khusus..." required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#030c3b] outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Upload Gambar</label>
                    <input type="file" name="file" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#030c3b] outline-none">
                </div>
                <div class="mt-12">
                    <button onclick="window.print()" class="bg-[#050560] hover:bg-[#cdbc0b] hover:text-[#050560] text-white font-bold py-3 px-8 rounded-full shadow-lg transition">🖨️ Cetak Laporan (PDF)</button>
            </div>
                <button type="submit" class="btn w-full mt-4 py-3 rounded-lg font-bold text-lg shadow-md hover:-translate-y-1 transform transition">Simpan Laporan</button>
            </form>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer bg-[#030c3b] py-6 mt-auto">
        <div class="container mx-auto text-center">
            <p class="text-white">&copy; 2026 Muhammad Yusuf Fauzi dan Fitra Luqmanul Safa. All rights reserved.</p>
        </div>
    </footer>

    <!-- PANGGIL FILE JAVASCRIPT -->
    <script src="../js/PBL.js"></script>
</body>
</html>
