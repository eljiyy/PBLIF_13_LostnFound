<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Data - FindIt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: url('images/bgpoltek.jpeg') no-repeat center center fixed; background-size: cover; color: white; }
        .estareal-overlay { position: fixed; inset: 0; background: linear-gradient(180deg, rgba(20,20,20,0.85) 0%, rgba(10,10,10,0.95) 100%); z-index: -2; }
        .perfect-blur { background: rgba(30, 30, 30, 0.4); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 40px 80px rgba(0,0,0,0.6); border-radius: 4px;}
        .glass-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.3); color: white; padding: 10px 0; outline: none; transition: 0.3s; font-size: 0.95rem; }
        .glass-input:focus { border-bottom: 1px solid white; }
        .glass-input option { background: #1a1a1a; color: white; }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-center p-6">
    <div class="bg-overlay"></div>
    <a href="PBL.html" class="absolute top-8 left-8 tracking-widest text-sm font-medium hover:text-gray-300 transition"><i class="fa-solid fa-arrow-left"></i> BERANDA</a>
    
    <div class="text-center mb-12">
        <h1 class="text-4xl font-medium tracking-wide mb-2">Statistik Sistem</h1>
        <p class="text-gray-400 font-light">Rekapitulasi total laporan yang diproses FindIt.</p>
    </div>

    <div class="flex flex-wrap justify-center gap-8 w-full max-w-4xl">
        <div class="glass-panel p-10 w-full md:w-64 text-center rounded-2xl shadow-xl border-t-2 border-t-red-500">
            <h3 id="totalHilang" class="text-5xl font-bold text-white mb-2">0</h3>
            <p class="text-xs tracking-widest text-red-400 uppercase">Barang Hilang</p>
        </div>
        <div class="glass-panel p-10 w-full md:w-64 text-center rounded-2xl shadow-xl border-t-2 border-t-green-500">
            <h3 id="totalDitemukan" class="text-5xl font-bold text-white mb-2">0</h3>
            <p class="text-xs tracking-widest text-green-400 uppercase">Ditemukan</p>
        </div>
        <div class="glass-panel p-10 w-full md:w-64 text-center rounded-2xl shadow-xl border-t-2 border-t-blue-500">
            <h3 id="totalSelesai" class="text-5xl font-bold text-white mb-2">0</h3>
            <p class="text-xs tracking-widest text-blue-400 uppercase">Kasus Selesai</p>
        </div>
    </div>

    <script src="../js/PBL.js"></script>
</body>
</html>
